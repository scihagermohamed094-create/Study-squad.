<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذاكِر بصحبة - Study Squad</title>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-primary: #6366f1;
            --emerald-green: #10b981;
            --amber-gold: #f59e0b;
            --cyan-blue: #06b6d4;
            --rose-red: #f43f5e;
            --purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }

        .btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }

        /* واجهة التطبيق الرئيسية (تظهر مباشرة) */
        #appContent {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 15px 20px;
            border-radius: 12px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        /* لوحة التحكم (Dashboard) */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .dash-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .dash-card h3 {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .dash-card .dash-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .app-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
        }

        .card-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #38bdf8;
            font-weight: bold;
        }

        /* قسم المتواجدون الآن (Online Squad) */
        .online-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .online-status-badge {
            font-size: 0.8rem;
            color: var(--text-sub);
            background: #0f172a;
            border: 1px solid var(--card-border);
            padding: 4px 10px;
            border-radius: 999px;
        }

        .online-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .online-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .online-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--emerald-green);
            margin-left: 8px;
        }

        .task-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .task-input-group input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: white;
            outline: none;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
        }

        .task-item.locked { opacity: 0.5; }
        .task-item.completed { border-color: var(--emerald-green); background: rgba(16, 185, 129, 0.1); }

        .timer-display {
            font-size: 3.5rem;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            color: var(--cyan-blue);
            font-family: monospace;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
        }

        .calc-screen {
            width: 100%;
            height: 40px;
            background: #000;
            color: #0f0;
            font-size: 1.2rem;
            text-align: left;
            padding: 5px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: none;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .calc-btn {
            padding: 12px;
            border-radius: 6px;
            border: none;
            background: #334155;
            color: white;
            cursor: pointer;
        }

        /* تنسيقات نافذة الذكاء الاصطناعي والصوت */
        .ai-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
        }

        .ai-controls-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .voice-toggle-btn {
            background: #0f172a;
            color: var(--cyan-blue);
            border: 1px solid var(--card-border);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .voice-toggle-btn.muted {
            color: var(--text-sub);
            opacity: 0.75;
        }

            display: none;
            background: #0f172a;
            border: 1px solid var(--card-border
